<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>TravelX | Reset Password</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet">

<!-- Bootstrap Icons -->
<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

:root{

--pink:#ff4fa3;
--rose:#ff6cb7;
--orange:#ff914d;
--purple:#9b4dff;
--dark:#2d2d39;

}

body{

min-height:100vh;

display:flex;
justify-content:center;
align-items:center;

background:linear-gradient(
135deg,
#fff6fb,
#ffffff,
#f8f8ff
);

padding:30px;

}

/*========================
CARD
========================*/

.reset-card{

max-width:950px;
width:100%;

background:#fff;

border-radius:30px;

overflow:hidden;

box-shadow:0 20px 60px rgba(0,0,0,.08);

}

/*========================
LEFT
========================*/

.left-side{

height:100%;

padding:60px 45px;

color:#fff;

background:linear-gradient(
135deg,
#ff4fa3,
#ff6cb7,
#ff914d,
#9b4dff
);

}

.left-side i{

font-size:75px;

margin-bottom:25px;

}

.left-side h2{

font-size:38px;

font-weight:700;

margin-bottom:20px;

}

.left-side p{

font-size:17px;

line-height:1.9;

}

/*========================
RIGHT
========================*/

.right-side{

padding:50px;

}

.page-title{

font-size:34px;

font-weight:700;

color:var(--dark);

}

.page-sub{

margin:12px 0 35px;

color:#777;

}

/*========================
FORM
========================*/

.form-label{

font-weight:600;

color:var(--dark);

}

.form-control{

height:55px;

border-radius:15px;

border:2px solid #ececec;

box-shadow:none;

transition:.3s;

}

.form-control:focus{

border-color:var(--pink);

box-shadow:0 0 0 .2rem rgba(255,79,163,.15);

}

.password-box{

position:relative;

}

.toggle-password{

position:absolute;

right:18px;

top:50%;

transform:translateY(-50%);

cursor:pointer;

color:#777;

}

.strength{

height:8px;

background:#ececec;

border-radius:30px;

margin-top:10px;

overflow:hidden;

}

.strength-bar{

width:0;

height:100%;

transition:.4s;

}

.error{

display:none;

color:#dc3545;

font-size:13px;

margin-top:6px;

}

/*========================
BUTTON
========================*/

.reset-btn{

width:100%;

height:55px;

border:none;

border-radius:50px;

font-size:17px;

font-weight:600;

color:#fff;

background:linear-gradient(
90deg,
#ff4fa3,
#ff6cb7,
#ff914d,
#9b4dff
);

transition:.35s;

box-shadow:0 12px 25px rgba(255,79,163,.25);

}

.reset-btn:hover{

transform:translateY(-3px);

box-shadow:0 15px 35px rgba(255,79,163,.35);

}

/*========================
RESPONSIVE
========================*/

@media(max-width:991px){

.left-side{

display:none;

}

.right-side{

padding:35px 25px;

}

}

</style>

</head>

<body>

<div class="container">

<div class="reset-card">

<div class="row g-0">

<div class="col-lg-5 d-none d-lg-block">

<div class="left-side d-flex flex-column justify-content-center h-100">

<i class="bi bi-shield-lock-fill"></i>

<h2>

Create New Password

</h2>

<p>

Your identity has been verified successfully.

Create a strong password to keep your TravelX account secure.

</p>

</div>

</div>

<div class="col-lg-7">

<div class="right-side">

<h2 class="page-title">

Reset Password

</h2>

<p class="page-sub">

Enter your new password.

</p>

<form id="resetForm">

<div class="mb-4">

<label class="form-label">

New Password

</label>

<div class="password-box">

<input
type="password"
class="form-control"
id="password"
placeholder="Enter new password">

<span
class="toggle-password"
id="togglePassword">

<i class="bi bi-eye"></i>

</span>

</div>

<div class="strength">

<div
class="strength-bar"
id="strengthBar">

</div>

</div>

<div
class="error"
id="passwordError">

Password must contain uppercase, lowercase, number, special character and minimum 8 characters.

</div>

</div>

<div class="mb-4">

<label class="form-label">

Confirm Password

</label>

<input
type="password"
class="form-control"
id="confirmPassword"
placeholder="Confirm password">

<div
class="error"
id="confirmError">

Passwords do not match.

</div>

</div>

<button
type="submit"
class="reset-btn">

<i class="bi bi-check-circle-fill me-2"></i>

Update Password

</button>
</form>

</div>

</div>

</div>

</div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<script>

/*=========================================
        SHOW / HIDE PASSWORD
=========================================*/

const password = document.getElementById("password");
const confirmPassword = document.getElementById("confirmPassword");
const togglePassword = document.getElementById("togglePassword");

togglePassword.addEventListener("click",function(){

    if(password.type==="password"){

        password.type="text";
        confirmPassword.type="text";

        togglePassword.innerHTML=
        '<i class="bi bi-eye-slash"></i>';

    }

    else{

        password.type="password";
        confirmPassword.type="password";

        togglePassword.innerHTML=
        '<i class="bi bi-eye"></i>';

    }

});

/*=========================================
        PASSWORD STRENGTH
=========================================*/

const strengthBar =
document.getElementById("strengthBar");

password.addEventListener("keyup",function(){

    let value=password.value;

    let strength=0;

    if(value.length>=8) strength++;

    if(/[A-Z]/.test(value)) strength++;

    if(/[a-z]/.test(value)) strength++;

    if(/[0-9]/.test(value)) strength++;

    if(/[@$!%*?&]/.test(value)) strength++;

    if(strength<=2){

        strengthBar.style.width="33%";
        strengthBar.style.background="#dc3545";

    }

    else if(strength<=4){

        strengthBar.style.width="66%";
        strengthBar.style.background="#ffc107";

    }

    else{

        strengthBar.style.width="100%";
        strengthBar.style.background="#198754";

    }

});

/*=========================================
        FORM VALIDATION
=========================================*/

const form =
document.getElementById("resetForm");

form.addEventListener("submit",function(e){

    e.preventDefault();

    document.getElementById("passwordError").style.display="none";
    document.getElementById("confirmError").style.display="none";

    let valid=true;

    const pattern =
    /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&]).{8,}$/;

    if(!pattern.test(password.value)){

        document.getElementById("passwordError").style.display="block";

        valid=false;

    }

    if(password.value!==confirmPassword.value){

        document.getElementById("confirmError").style.display="block";

        valid=false;

    }

    if(valid){

        const btn=document.querySelector(".reset-btn");

        btn.disabled=true;

        btn.innerHTML=`
        <span class="spinner-border spinner-border-sm me-2"></span>
        Updating Password...
        `;

        setTimeout(function(){

            alert("🎉 Password Updated Successfully!");

            window.location.href="login.html";

        },2000);

    }

});

</script>

</body>

</html>
