<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>TravelX | Forgot Password</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
rel="stylesheet">

<!-- Bootstrap Icons -->
<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

:root{
    --pink:#ff4fa3;
    --rose:#ff6cb7;
    --orange:#ff914d;
    --purple:#9b4dff;
    --dark:#2d2d39;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(
        135deg,
        #fff6fb,
        #ffffff,
        #f8f8ff
    );
    padding:30px;
}

/*======================
CARD
======================*/

.forgot-card{
    max-width:900px;
    width:100%;
    background:#fff;
    border-radius:30px;
    overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,.08);
}

/*======================
LEFT PANEL
======================*/

.left-side{
    background:linear-gradient(
        135deg,
        #ff4fa3,
        #ff6cb7,
        #ff914d,
        #9b4dff
    );
    color:#fff;
    padding:60px 45px;
    height:100%;
}

.left-side i{
    font-size:70px;
    margin-bottom:25px;
}

.left-side h2{
    font-size:38px;
    font-weight:700;
    margin-bottom:20px;
}

.left-side p{
    font-size:17px;
    line-height:1.9;
}

/*======================
RIGHT PANEL
======================*/

.right-side{
    padding:50px;
}

.page-title{
    font-size:34px;
    font-weight:700;
    color:var(--dark);
    margin-bottom:10px;
}

.page-subtitle{
    color:#777;
    margin-bottom:35px;
}

/*======================
FORM
======================*/

.form-label{
    font-weight:600;
    color:var(--dark);
}

.form-control{
    height:55px;
    border-radius:15px;
    border:2px solid #ececec;
    box-shadow:none;
    transition:.3s;
}

.form-control:focus{
    border-color:var(--pink);
    box-shadow:0 0 0 .2rem rgba(255,79,163,.15);
}

.error{
    display:none;
    color:#dc3545;
    font-size:13px;
    margin-top:6px;
}

.success{
    display:none;
    color:#198754;
    font-size:13px;
    margin-top:6px;
}

/*======================
BUTTON
======================*/

.send-btn{
    width:100%;
    height:55px;
    border:none;
    border-radius:50px;
    color:#fff;
    font-size:17px;
    font-weight:600;
    background:linear-gradient(
        90deg,
        #ff4fa3,
        #ff6cb7,
        #ff914d,
        #9b4dff
    );
    transition:.35s;
    box-shadow:0 12px 25px rgba(255,79,163,.25);
}

.send-btn:hover{
    transform:translateY(-3px);
    box-shadow:0 15px 35px rgba(255,79,163,.35);
}

.back-login{
    text-decoration:none;
    color:var(--pink);
    font-weight:600;
}

.back-login:hover{
    text-decoration:underline;
}

/*======================
RESPONSIVE
======================*/

@media(max-width:991px){

.left-side{
display:none;
}

.right-side{
padding:35px 25px;
}

}

</style>

</head>

<body>

<div class="container">

<div class="forgot-card">

<div class="row g-0">

<!-- LEFT -->

<div class="col-lg-5 d-none d-lg-block">

<div class="left-side d-flex flex-column justify-content-center h-100">

<i class="bi bi-shield-lock-fill"></i>

<h2>Forgot Password?</h2>

<p>
No worries! Enter your registered email address and we'll send a One-Time Password (OTP) to securely reset your TravelX account password.
</p>

</div>

</div>

<!-- RIGHT -->

<div class="col-lg-7">

<div class="right-side">

<h2 class="page-title">
Reset Your Password
</h2>

<p class="page-subtitle">
Enter your registered email address.
</p>

<form id="forgotForm">

<div class="mb-4">

<label class="form-label">
Email Address
</label>

<input
type="email"
id="email"
class="form-control"
placeholder="Enter your registered email">

<div class="error" id="emailError">
Please enter a valid email address.
</div>

<div class="success" id="emailSuccess">
OTP has been sent successfully.
</div>

</div>

<button
type="submit"
class="send-btn">

<i class="bi bi-send-fill me-2"></i>

Send OTP

</button>

<div class="text-center mt-4">

<a
href="login.html"
class="back-login">

<i class="bi bi-arrow-left"></i>

Back to Login

</a>

</div>

</form>
</div>

</div>

</div>

</div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<script>

/*=========================================
        Forgot Password Validation
==========================================*/

const form = document.getElementById("forgotForm");
const email = document.getElementById("email");
const emailError = document.getElementById("emailError");
const emailSuccess = document.getElementById("emailSuccess");
const sendBtn = document.querySelector(".send-btn");

form.addEventListener("submit", function(e){

    e.preventDefault();

    emailError.style.display = "none";
    emailSuccess.style.display = "none";

    const emailPattern =
    /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if(!emailPattern.test(email.value.trim())){

        emailError.style.display = "block";
        email.focus();

        return;

    }

    sendBtn.disabled = true;

    sendBtn.innerHTML = `
    <span class="spinner-border spinner-border-sm me-2"></span>
    Sending OTP...
    `;

    setTimeout(function(){

        emailSuccess.style.display = "block";

        sendBtn.disabled = false;

        sendBtn.innerHTML = `
        <i class="bi bi-send-fill me-2"></i>
        Send OTP
        `;

        setTimeout(function(){

            window.location.href = "otp.html";

        },1500);

    },2000);

});

</script>

</body>

</html>
